name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pandas pillow

      - name: Run Black (formatting check)
        run: black --check Week4/src Week4/tests || true

      - name: Run Flake8 (linting)
        run: flake8 Week4/src Week4/tests --max-line-length=120 || true

      - name: Run pytest
        run: |
          cd Week4
          python -m pytest tests/test_pipeline.py -v
